name: Honey
description: >-
  Honey was a modern intranet and internal-communications SaaS platform (honey.is)
  built to connect distributed teams, streamline company-wide communication, drive and
  quantify employee engagement, and replace outdated intranets. Launched in 2013, it was
  incubated by the design agency Huge and its parent Interpublic Group in Brooklyn, and
  raised a $1M seed round from Point Nine Capital in 2015; customers included Capital One,
  Coca-Cola Hellenic, Lowe's, and Sesame Street. The company is now defunct: the honey.is
  domain no longer resolves and it publishes no live website, developer portal, API, or
  documentation. This profile is retained as a Point Nine portfolio lead with no active
  API surface to enrich.
